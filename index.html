<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciao!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
    }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #00d4ff, #7b2ff7);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.85;
      margin-bottom: 1.5rem;
    }

    button {
      font-size: 1rem;
      padding: 0.7rem 1.8rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(90deg, #00d4ff, #7b2ff7);
      color: #fff;
      transition: transform 0.15s ease;
    }

    button:hover { transform: scale(1.07); }

    #saluto { margin-top: 1rem; min-height: 1.5rem; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Ciao! 👋</h1>
    <p>Benvenuto nella mia piccola pagina.</p>
    <button onclick="saluta()">Premimi</button>
    <div id="saluto"></div>
  </main>

  <script>
    const saluti = ["Ciao!", "Buongiorno!", "Che piacere vederti!", "Come stai?", "Benvenuto!"];
    function saluta() {
      const s = saluti[Math.floor(Math.random() * saluti.length)];
      document.getElementById("saluto").textContent = s;
    }
  </script>
</body>
</html>
